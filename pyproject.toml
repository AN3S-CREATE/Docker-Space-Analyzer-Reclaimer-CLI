[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docker-disk-toolkit"
version = "0.1.0"
description = "Production-grade Docker disk space analyzer, safe cleaner, and recovery toolkit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andries Liebenberg" }]
keywords = [
    "docker",
    "disk-space",
    "cleanup",
    "prune",
    "devops",
    "wsl2",
    "docker-desktop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "psutil>=5.9",
    "jinja2>=3.1",
    "platformdirs>=4.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional docker-py SDK fallback (subprocess CLI is the primary path).
sdk = ["docker>=7.0"]
# Development / test tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.4",
    "types-psutil",
    "types-pyyaml",
]

[project.urls]
Homepage = "https://github.com/andriesl/docker-disk-toolkit"
Repository = "https://github.com/andriesl/docker-disk-toolkit"
Issues = "https://github.com/andriesl/docker-disk-toolkit/issues"

[project.scripts]
docker-disk = "docker_disk_toolkit.cli:app"
ddt = "docker_disk_toolkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_disk_toolkit"]
# Non-Python files under the package (Jinja2 templates) are included by default.
artifacts = ["src/docker_disk_toolkit/templates/**/*.j2"]

[tool.hatch.build.targets.sdist]
include = [
    "src/docker_disk_toolkit",
    "tests",
    "scripts",
    "docs",
    "README.md",
    "Makefile",
]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    "B008",  # typer uses function calls in argument defaults by design
    "SIM108", # ternary can hurt readability for guard clauses
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["docker_disk_toolkit"]

# ----------------------------------------------------------------------------
# Black
# ----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# ----------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_untyped_defs = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src/docker_disk_toolkit"]

[[tool.mypy.overrides]]
module = ["docker.*", "winotify.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest / coverage
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests exercising the CLI via CliRunner",
    "golden: golden-file rendering tests",
]

[tool.coverage.run]
branch = true
source = ["docker_disk_toolkit"]
omit = ["*/templates/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
